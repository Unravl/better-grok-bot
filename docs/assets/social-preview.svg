<rect x="510.5" y="470" width="246" height="48" rx="24" fill="#FFFFFF" fill-opacity=".06" stroke="url(#c)" stroke-opacity=".75" stroke-width="1.5"/><text x="633.5" y="501.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F0F6FC">Keep-alive voice</text>
<rect x="770.5" y="470" width="157" height="48" rx="24" fill="#FFFFFF" fill-opacity=".06" stroke="url(#c)" stroke-opacity=".75" stroke-width="1.5"/><text x="849" y="501.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F0F6FC">Voice MCP</text>
<rect x="941.5" y="470" width="183" height="48" rx="24" fill="#FFFFFF" fill-opacity=".06" stroke="url(#c)" stroke-opacity=".75" stroke-width="1.5"/><text x="1033" y="501.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F0F6FC">Chat search</text>
<text x="640" y="590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9AA4B2" fill-opacity=".8">github.com/Unravl/better-grok-bot</text>
