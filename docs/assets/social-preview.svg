<text x="640" y="418" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#9AA4B2">The modding framework for the Grok Bot desktop app</text>
<rect x="155.5" y="470" width="132" height="48" rx="24" fill="#FFFFFF" fill-opacity=".06" stroke="url(#c)" stroke-opacity=".75" stroke-width="1.5"/><text x="221.5" y="501.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F0F6FC">Folders</text>
