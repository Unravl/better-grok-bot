<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Better Grok Bot">
<title>Better Grok Bot</title>
<defs>
<linearGradient id="tile" x1="0" y1="25" x2="0" y2="231" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#333"/><stop offset=".45" stop-color="#242424"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
<linearGradient id="tile-rim" x1="25" y1="25" x2="231" y2="231" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".3" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset=".75" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
<linearGradient id="tile-gloss" x1="25" y1="25" x2="231" y2="231" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
<radialGradient id="sphere" cx="154" cy="96" r="200" fx="157" fy="123" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbfbfc"/><stop offset=".1" stop-color="#f4f4f5"/><stop offset=".2" stop-color="#e7e7e9"/><stop offset=".3" stop-color="#dddddf"/><stop offset=".5" stop-color="#c4c4c8"/><stop offset=".7" stop-color="#a0a0a4"/><stop offset=".8" stop-color="#8e8e92"/><stop offset="1" stop-color="#6b6b70"/></radialGradient>
<linearGradient id="sphere-rim" x1="190" y1="88" x2="220" y2="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="spill" cx="151" cy="127" r="74" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".08"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="eye"><stop offset="0" stop-color="#ecfeff"/><stop offset=".35" stop-color="#a5f3fc"/><stop offset=".75" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></radialGradient>
<linearGradient id="lip" x1="0" y1="0" x2="1" y2="1"><stop offset=".45" stop-color="#ecfeff" stop-opacity="0"/><stop offset=".8" stop-color="#ecfeff" stop-opacity=".85"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
<filter id="drop" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="contact" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="glow-far" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="glow-near" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="gloss-blur" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.6"/></filter>
<clipPath id="tile-clip"><path d="M25 84V172C25 214.5 41.5 231 84 231H172C214.5 231 231 214.5 231 172V84C231 41.5 214.5 25 172 25H84C41.5 25 25 41.5 25 84Z"/></clipPath>
</defs>
<!-- Tile: macOS icon grid, continuous corners, soft drop shadow -->
<path d="M25 84V172C25 214.5 41.5 231 84 231H172C214.5 231 231 214.5 231 172V84C231 41.5 214.5 25 172 25H84C41.5 25 25 41.5 25 84Z" transform="translate(0 2)" fill="#000" opacity=".28" filter="url(#drop)"/>
<path d="M25 84V172C25 214.5 41.5 231 84 231H172C214.5 231 231 214.5 231 172V84C231 41.5 214.5 25 172 25H84C41.5 25 25 41.5 25 84Z" fill="url(#tile)"/>
<g clip-path="url(#tile-clip)">
<!-- Sphere: contact shadow, shading, cyan spill from the eyes, top rim light -->
<circle cx="114.5" cy="180" r="117.2" fill="#000" opacity=".55" filter="url(#contact)"/>
<circle cx="113" cy="177.8" r="117.2" fill="url(#sphere)"/>
<circle cx="113" cy="177.8" r="117.2" fill="url(#spill)"/>
<circle cx="113" cy="177.8" r="115.2" fill="none" stroke="url(#sphere-rim)" stroke-width="3.4"/>
<!-- Awakened eyes: glow, lit lip, core, specular -->
<g fill="#22d3ee">
<g filter="url(#glow-far)" opacity=".9"><rect x="-14.8" y="-32.3" width="29.6" height="64.6" rx="14.8" transform="translate(124.7 139.9) rotate(-35.2)"/><rect x="-9.4" y="-32.4" width="18.8" height="64.8" rx="9.4" ry="14.5" transform="translate(179.6 114) rotate(-35.7)"/></g>
<g filter="url(#glow-near)" stroke="#22d3ee" stroke-width="3"><rect x="-14.8" y="-32.3" width="29.6" height="64.6" rx="14.8" transform="translate(124.7 139.9) rotate(-35.2)"/><rect x="-9.4" y="-32.4" width="18.8" height="64.8" rx="9.4" ry="14.5" transform="translate(179.6 114) rotate(-35.7)"/></g>
</g>
<g fill="none" stroke="url(#lip)" stroke-width="2.8"><rect x="-16.2" y="-33.7" width="32.4" height="67.4" rx="16.2" transform="translate(124.7 139.9) rotate(-35.2)"/><rect x="-10.8" y="-33.8" width="21.6" height="67.6" rx="10.8" ry="15.9" transform="translate(179.6 114) rotate(-35.7)"/></g>
<g fill="url(#eye)"><rect x="-14.8" y="-32.3" width="29.6" height="64.6" rx="14.8" transform="translate(124.7 139.9) rotate(-35.2)"/><rect x="-9.4" y="-32.4" width="18.8" height="64.8" rx="9.4" ry="14.5" transform="translate(179.6 114) rotate(-35.7)"/></g>
<g fill="#fff" opacity=".85"><rect x="-4.5" y="-25.5" width="6" height="11" rx="3" transform="translate(124.7 139.9) rotate(-35.2)"/><rect x="-3" y="-25.5" width="4" height="10" rx="2" transform="translate(179.6 114) rotate(-35.7)"/></g>
</g>
<!-- Glass edge: soft corner gloss and a crisp inner rim -->
<g clip-path="url(#tile-clip)" fill="none">
<path d="M25 84V172C25 214.5 41.5 231 84 231H172C214.5 231 231 214.5 231 172V84C231 41.5 214.5 25 172 25H84C41.5 25 25 41.5 25 84Z" stroke="url(#tile-gloss)" stroke-width="7" filter="url(#gloss-blur)"/>
<path d="M25 84V172C25 214.5 41.5 231 84 231H172C214.5 231 231 214.5 231 172V84C231 41.5 214.5 25 172 25H84C41.5 25 25 41.5 25 84Z" stroke="url(#tile-rim)" stroke-width="2.5"/>
</g>
</svg>
